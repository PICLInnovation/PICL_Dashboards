<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b16">
<script>
/* Performance tier: decides BEFORE first paint whether to use "lite" visuals.
   Lite = no blur/glass, no particles, no infinite animations (Android TV, old phones, low RAM).
   Override: add ?perf=lite or ?perf=full to the address. */
(function(){
  var ua = navigator.userAgent, q = /[?&]perf=(lite|full)/.exec(location.search), saved = null;
  try{ saved = localStorage.getItem("picl_perf"); }catch(e){}
  if(q){ saved = q[1]; try{ localStorage.setItem("picl_perf", saved); }catch(e){} }
  var tv  = /\bTV\b|AFT[A-Z0-9]+|BRAVIA|SHIELD|MIBOX|MiTV|CrKey|Tizen|Web0S|WebOS|SMART-TV|SmartTV|HbbTV|Chromecast|FireTV|GoogleTV/i.test(ua);
  var mem = navigator.deviceMemory, cpu = navigator.hardwareConcurrency;
  var weak = tv || (mem && mem <= 2) || (cpu && cpu <= 2);
  var lite = saved ? saved === "lite" : !!weak;
  window.PERF = { lite: lite, forced: !!saved, tv: tv };
  if(lite) document.documentElement.classList.add("lite");
})();
</script>
<title>PICL India · Plant Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060b16; --bg2:#0b1426; --surface:rgba(255,255,255,.05); --surface-solid:#0f192d;
    --line:rgba(255,255,255,.09); --text:#eaf1ff; --mute:#8d9bb8;
    --accent:#4da3ff; --accent2:#2563eb; --live:#22d38a;
    --head:rgba(8,14,27,.72); --hover:rgba(255,255,255,.06);
    --shadow:0 10px 40px rgba(0,0,0,.35);
    --blob-op:.55; --grid:rgba(255,255,255,.035);
    --head-h:66px; --nav-h:66px;
    --font-d:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;
    --font-b:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#eef3fa; --bg2:#e3ebf6; --surface:rgba(255,255,255,.72); --surface-solid:#ffffff;
    --line:rgba(18,40,74,.10); --text:#0f1b33; --mute:#5b6a82;
    --accent:#2563eb; --accent2:#1d4ed8;
    --head:rgba(255,255,255,.78); --hover:rgba(18,40,74,.06);
    --shadow:0 10px 36px rgba(18,40,74,.10);
    --blob-op:.35; --grid:rgba(18,40,74,.045);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-b); background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
       transition:background .4s,color .4s}
  button,a,input{font-family:inherit}
  button{color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ============ Animated backdrop ============ */
  .backdrop{position:fixed; inset:0; z-index:0; overflow:hidden; background:
      radial-gradient(1200px 700px at 80% -10%, var(--bg2), transparent 70%), var(--bg)}
  .backdrop::after{content:""; position:absolute; inset:-30px; transform:translate(var(--gx,0px),var(--gy,0px)); transition:transform .4s ease-out;
      background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
      background-size:56px 56px; mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%);
      -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 75%)}
  .blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:var(--blob-op); will-change:transform; contain:layout paint}
  .b1{width:520px;height:520px;background:var(--b1);left:-120px;top:-100px;animation:drift1 22s ease-in-out infinite alternate}
  .b2{width:460px;height:460px;background:var(--b2);right:-100px;top:12%;opacity:calc(var(--blob-op)*.55);animation:drift2 26s ease-in-out infinite alternate}
  .b3{width:520px;height:520px;background:var(--b3);left:30%;bottom:-220px;animation:drift3 30s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(160px,120px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-180px,140px) scale(.9)}}
  @keyframes drift3{to{transform:translate(-140px,-80px) scale(1.2)}}
  #fx{position:absolute; inset:0; width:100%; height:100%}

  /* ============ Header ============ */
  .head{
    position:relative; z-index:20; flex:0 0 var(--head-h); height:var(--head-h);
    display:flex; align-items:stretch; gap:26px; padding:0 20px;
    background:var(--head); border-bottom:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  }
  .brand{display:flex; align-items:center; gap:12px; flex:0 0 auto; cursor:pointer; background:none; border:0; text-align:left}
  .mark{
    position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    font-family:var(--font-d); font-weight:700; font-size:14.5px; letter-spacing:.03em; color:#10192c;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 18px rgba(59,130,246,.4);
  }
  .mark::after{content:""; position:absolute; inset:-3px; border-radius:15px; border:1.5px solid var(--accent); opacity:0; animation:ping 3.2s ease-out infinite}
  @keyframes ping{0%{transform:scale(.9);opacity:.7}70%,100%{transform:scale(1.25);opacity:0}}
  .mark.logo{width:48px; height:48px; padding:3px; background:#fff; border-radius:13px; box-shadow:0 6px 18px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.5) inset; transition:transform .3s cubic-bezier(.3,.9,.3,1.3)}
  .mark.logo img{width:100%; height:100%; object-fit:contain; display:block; border-radius:10px}
  .brand:hover .mark.logo{transform:rotate(-6deg) scale(1.06)}
  .brand h1{font-family:var(--font-d); font-size:20px; font-weight:700; line-height:1.05; letter-spacing:.01em}
  .brand p{font-size:12px; color:var(--mute); margin-top:2px}

  .tabs{position:relative; display:flex; align-items:stretch; flex:1 1 auto; min-width:0; gap:2px; overflow-x:auto; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none; background:transparent; border:0; color:var(--mute); cursor:pointer; position:relative; white-space:nowrap;
    display:flex; align-items:center; gap:9px; padding:0 15px; font-size:15px; font-weight:500; transition:color .2s,background .2s;
  }
  .tab:hover{color:var(--text); background:var(--hover)}
  .tab svg.ic{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
  .tab[aria-selected="true"]{color:var(--text); font-weight:600}
  .tab[aria-selected="true"] svg.ic{color:var(--tc,var(--accent))}
  .ink{position:absolute; bottom:0; left:0; height:3px; border-radius:3px 3px 0 0; pointer-events:none;
       background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 14px var(--accent);
       transition:transform .35s cubic-bezier(.3,.9,.3,1), width .35s cubic-bezier(.3,.9,.3,1)}
  .lamp{width:7px; height:7px; border-radius:50%; flex:0 0 auto; background:var(--line)}
  .tab[data-state="loading"] .lamp{background:var(--accent); animation:blink 1s ease-in-out infinite}
  .tab[data-state="live"] .lamp{background:var(--live); box-shadow:0 0 8px var(--live)}
  @keyframes blink{50%{opacity:.25}}

  .right{display:flex; align-items:center; gap:4px; flex:0 0 auto}
  .search{
    display:flex; align-items:center; gap:9px; height:38px; padding:0 10px 0 12px; margin-right:6px; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:11px; color:var(--mute); font-size:13.5px; transition:border-color .2s,color .2s
  }
  .search:hover{border-color:var(--accent); color:var(--text)}
  .search svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  kbd{font:600 11px var(--font-b); padding:2px 6px; border-radius:6px; background:var(--hover); border:1px solid var(--line); color:var(--mute)}
  .btn{
    appearance:none; width:38px; height:38px; border-radius:11px; border:0; background:transparent; color:var(--mute);
    cursor:pointer; display:grid; place-items:center; text-decoration:none; transition:background .2s,color .2s,transform .2s;
  }
  .btn:hover{background:var(--hover); color:var(--text)}
  .btn:active{transform:scale(.92)}
  .btn svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .btn.cycle:hover{color:var(--accent)}
  #btnTheme .sun{display:none} :root[data-theme="light"] #btnTheme .sun{display:block} :root[data-theme="light"] #btnTheme .moon{display:none}

  /* ============ Stage ============ */
  .stage{position:relative; z-index:5; flex:1 1 auto; min-height:0}
  .pane{position:absolute; inset:0; display:none}
  .pane.active{display:block; animation:paneIn .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes paneIn{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  iframe{width:100%; height:100%; border:0; display:block; background:#fff}

  .loader{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:var(--bg); color:var(--mute); font-size:14px; transition:opacity .35s}
  .loader.hide{opacity:0; pointer-events:none}
  .orbit{position:relative; width:64px; height:64px}
  .orbit i{position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:var(--lc,var(--accent)); animation:spin 1s linear infinite}
  .orbit i:nth-child(2){inset:9px; border-top-color:var(--accent2); animation-duration:1.6s; animation-direction:reverse}
  .orbit i:nth-child(3){inset:19px; border-top-color:var(--text); opacity:.5; animation-duration:.8s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{width:200px; height:4px; border-radius:4px; background:var(--line); overflow:hidden}
  .bar b{display:block; height:100%; width:40%; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent2)); animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  .loader .hint{display:none; text-align:center}
  .loader.slow .hint{display:block}
  .loader a{color:var(--accent); font-weight:600}

  /* ============ Home ============ */
  .home{overflow-y:auto; scrollbar-width:thin}
  .wrap{position:relative; z-index:1; max-width:1140px; margin:0 auto; padding:40px 28px 60px}
  .eyebrow{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
  .pill{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500;
        background:var(--surface); border:1px solid var(--line); color:var(--mute); backdrop-filter:blur(10px)}
  .pill b{color:var(--text); font-weight:600}
  .dot{position:relative; width:8px; height:8px; border-radius:50%; background:var(--live)}
  .dot::after{content:""; position:absolute; inset:0; border-radius:50%; background:inherit; opacity:0; pointer-events:none; animation:pulse 2s ease-out infinite}
  #skyDot::after{display:none}
  .dot.off{background:#ef4444} .dot.off::after,.dot.night::after{display:none}
  .dot.night{background:#7c8cff}
  @keyframes pulse{0%{transform:scale(1); opacity:.55}100%{transform:scale(2.8); opacity:0}}

  .hero{display:flex; align-items:flex-end; justify-content:space-between; gap:30px; margin-top:22px; flex-wrap:wrap}
  .hero h2{font-family:var(--font-d); font-size:clamp(34px,5.4vw,60px); font-weight:700; line-height:1; letter-spacing:-.005em}
  .grad{background:linear-gradient(95deg,var(--accent) 0%,var(--accent2) 55%,#7c9cff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
        background-size:200% 100%; animation:shine 7s ease-in-out infinite alternate}
  @keyframes shine{to{background-position:100% 0}}
  .lead{margin-top:14px; font-size:17px; color:var(--mute); max-width:56ch; line-height:1.55}
  .clock{text-align:right}
  .clock .t{font-family:var(--font-d); font-weight:600; font-size:clamp(38px,5vw,56px); line-height:1; letter-spacing:.02em; font-variant-numeric:tabular-nums}
  .clock .t{display:flex; align-items:center; justify-content:flex-end; gap:.14em}
  .clock .t small{font-size:.4em; color:var(--mute); align-self:flex-end; margin:0 0 .35em .3em}
  /* refined separator: two soft dots + a hairline that fills once per minute */
  .sep{display:flex; flex-direction:column; gap:.2em; padding:0 .04em; transform:translateY(-.03em)}
  .sep i{width:.1em; height:.1em; min-width:5px; min-height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:sepglow 2s ease-in-out infinite}
  .sep i:nth-child(2){animation-delay:1s}
  @keyframes sepglow{0%,100%{opacity:1}50%{opacity:.3}}
  .secbar{height:2px; margin-top:10px; border-radius:2px; background:var(--line); overflow:hidden}
  .secbar b{display:block; height:100%; width:100%; transform-origin:left; transform:scaleX(0); border-radius:2px;
    background:linear-gradient(90deg,var(--accent2),var(--accent)); animation:secfill 60s linear infinite; animation-delay:var(--d,0s)}
  @keyframes secfill{to{transform:scaleX(1)}}
  .clock .d{margin-top:6px; color:var(--mute); font-size:14px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:30px}
  .stat{padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--line); backdrop-filter:blur(12px)}
  .stat .n{font-family:var(--font-d); font-size:30px; font-weight:700; line-height:1}
  .stat .l{margin-top:6px; font-size:13px; color:var(--mute)}

  .resume{display:none; margin-top:22px; align-items:center; gap:12px; padding:12px 16px; border-radius:14px; cursor:pointer; width:fit-content; max-width:100%;
          background:linear-gradient(120deg,rgba(59,130,246,.16),rgba(37,99,235,.08)); border:1px solid rgba(59,130,246,.35); font-size:14.5px; transition:transform .2s}
  .resume:hover{transform:translateX(4px)}
  .resume.show{display:flex}
  .resume svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:22px; margin-top:26px; perspective:1400px}
  .card{
    --c:#2563eb; --mx:50%; --my:50%; --rx:0deg; --ry:0deg;
    position:relative; text-align:left; cursor:pointer; font:inherit; overflow:hidden; isolation:isolate;
    background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:26px 26px 22px;
    box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; flex-direction:column; gap:14px;
    transform:rotateX(var(--rx)) rotateY(var(--ry)); transform-style:preserve-3d;
    transition:transform .25s ease-out, border-color .25s, box-shadow .25s;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes rise{from{opacity:0; transform:translateY(26px)}}
  .card::before{content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .3s;
      background:radial-gradient(420px circle at var(--mx) var(--my), color-mix(in srgb,var(--c) 28%,transparent), transparent 62%)}
  .card::after{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,var(--c),transparent)}
  .card:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent); box-shadow:0 18px 50px color-mix(in srgb,var(--c) 22%,transparent)}
  .card:hover::before{opacity:1}
  .card .top{display:flex; align-items:center; gap:14px}
  .tile{width:54px; height:54px; border-radius:15px; display:grid; place-items:center; flex:0 0 auto; color:#fff;
        background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000)); box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent); transform:translateZ(30px); animation:bob 4.5s ease-in-out infinite}
  .tile svg{width:27px; height:27px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  .card h3{font-family:var(--font-d); font-size:27px; font-weight:700; line-height:1.1}
  .live{margin-left:auto; display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--live)}
  .live .dot{width:7px;height:7px}
  .card .desc{font-size:15.5px; color:var(--mute); line-height:1.5}
  .spark{width:100%; height:46px; overflow:visible}
  .spark path.l{fill:none; stroke:var(--c); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:600; stroke-dashoffset:600; animation:draw 2.2s .4s ease-out forwards}
  .spark path.a{fill:url(#g-c); opacity:0; animation:fadeIn 1s 1.6s forwards}
  @keyframes draw{to{stroke-dashoffset:0}} @keyframes fadeIn{to{opacity:1}}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:12.5px; font-weight:500; padding:4px 10px; border-radius:999px; background:var(--hover); color:var(--mute); border:1px solid var(--line); transition:all .2s}
  .card:hover .chip{color:var(--text); border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  .open{margin-top:4px; align-self:flex-start; display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; color:#fff;
        background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000)); padding:10px 18px; border-radius:11px; transition:gap .25s, box-shadow .25s}
  .open svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round; transition:transform .25s}
  .card:hover .open{gap:12px; box-shadow:0 8px 20px color-mix(in srgb,var(--c) 40%,transparent)}
  .card:hover .open svg{transform:translateX(3px)}
  .foot{margin-top:30px; font-size:13.5px; color:var(--mute); display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between}
  .foot .keys{display:flex; gap:12px; flex-wrap:wrap}

  /* ============ Command palette ============ */
  .pal{position:fixed; inset:0; z-index:60; display:none; align-items:flex-start; justify-content:center; padding-top:14vh;
       background:rgba(3,7,15,.55); backdrop-filter:blur(6px)}
  .pal.open{display:flex; animation:fadeIn2 .2s}
  @keyframes fadeIn2{from{opacity:0}}
  .pbox{width:min(560px,92vw); background:var(--surface-solid); border:1px solid var(--line); border-radius:18px; box-shadow:0 30px 80px rgba(0,0,0,.5); overflow:hidden; animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:translateY(-12px) scale(.97); opacity:0}}
  .pbox input{width:100%; padding:18px 20px; font-size:17px; background:transparent; border:0; border-bottom:1px solid var(--line); color:var(--text); outline:none}
  .plist{max-height:50vh; overflow-y:auto; padding:8px}
  .pit{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:11px; cursor:pointer; font-size:15px}
  .pit svg{width:19px;height:19px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pit small{margin-left:auto; color:var(--mute); font-size:12px}
  .pit.sel{background:var(--hover)} .pit.sel svg{stroke:var(--accent)}
  .pempty{padding:20px; color:var(--mute); text-align:center; font-size:14px}

  /* ============ Full screen / TV mode ============ */
  body.kiosk .head{display:none}
  body.kiosk .tabs{display:none}
  .kbar{display:none; position:fixed; top:10px; right:12px; z-index:40; gap:6px; padding:5px; border-radius:999px; background:rgba(10,18,34,.78); backdrop-filter:blur(10px); opacity:.35; transition:opacity .2s}
  .kbar:hover,.kbar:focus-within{opacity:1}
  .kbar button{width:34px; height:34px; border-radius:50%; border:0; background:transparent; color:#fff; cursor:pointer; display:grid; place-items:center}
  .kbar button:hover{background:rgba(255,255,255,.16)}
  .kbar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kbar .cy{display:none} body.cycling .kbar .cy{display:grid}
  .kbar .label{display:none; align-self:center; padding:0 8px; color:#fff; font-size:13px; font-weight:600} body.cycling .kbar .label{display:block}
  body.kiosk .kbar{display:flex}
  .cprog{display:none; position:fixed; left:0; top:0; height:3px; z-index:41; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0}
  body.cycling .cprog{display:block}
  body.kiosk .stage{padding-bottom:0}

  /* ============ Toast ============ */
  .toast{position:fixed; left:50%; bottom:90px; z-index:70; transform:translate(-50%,20px); opacity:0; pointer-events:none;
         padding:10px 16px; border-radius:12px; background:var(--surface-solid); border:1px solid var(--line); box-shadow:var(--shadow); font-size:14px; transition:all .3s}
  .toast.show{opacity:1; transform:translate(-50%,0)}

  /* ============ Creative extras ============ */
  .cglow{position:absolute; left:0; top:0; width:500px; height:500px; border-radius:50%; pointer-events:none; will-change:transform;
         background:radial-gradient(circle,color-mix(in srgb,var(--accent) 20%,transparent),transparent 65%)}

  .type{margin-top:14px; font-family:var(--font-d); font-size:clamp(20px,2.6vw,28px); font-weight:600; color:var(--accent); min-height:1.3em}
  .caret{display:inline-block; width:2px; height:1em; background:var(--accent); margin-left:3px; vertical-align:-.12em; animation:blink 1s steps(1) infinite}

  .stat.safe .n{color:var(--live)}
  .stat{transition:transform .25s, border-color .25s} .stat:hover{transform:translateY(-3px); border-color:var(--accent)}

  .mq{margin-top:30px; overflow:hidden; border-block:1px solid var(--line); padding:13px 0;
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
  .mq .track{display:flex; width:max-content; animation:mq 40s linear infinite}
  .mq:hover .track{animation-play-state:paused}
  .mq span{display:flex; align-items:center; gap:44px; padding-left:22px; white-space:nowrap; font-family:var(--font-d); font-weight:600; font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute)}
  .mq span::after{content:"◆"; color:var(--accent); font-size:9px}
  @keyframes mq{to{transform:translateX(-50%)}}

  .gears{position:fixed; right:-90px; bottom:-90px; width:620px; height:620px; z-index:0; pointer-events:none; opacity:.07; color:var(--accent)}
  .gears svg{width:100%; height:100%}
  .spin{transform-origin:0 0; animation:rot 60s linear infinite} .spin.rev{animation-direction:reverse; animation-duration:42s}
  @keyframes rot{to{transform:rotate(360deg)}}

  .rip{position:absolute; z-index:-1; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; pointer-events:none;
       background:color-mix(in srgb,var(--c) 40%,transparent); transform:scale(0); animation:rip .75s ease-out forwards}
  @keyframes rip{to{transform:scale(22); opacity:0}}

  .iris{position:fixed; inset:0; z-index:15; pointer-events:none; opacity:0; background:var(--ic,var(--accent)); --ix:50%; --iy:50%}
  .iris.go{animation:iris .75s cubic-bezier(.4,0,.2,1)}
  @keyframes iris{0%{opacity:.3; clip-path:circle(0% at var(--ix) var(--iy))}60%{opacity:.16; clip-path:circle(150% at var(--ix) var(--iy))}100%{opacity:0; clip-path:circle(150% at var(--ix) var(--iy))}}


  .splash{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; cursor:pointer;
          background:radial-gradient(900px 600px at 50% 40%, var(--bg2), var(--bg)); transition:opacity .6s, transform .6s}
  .splash.out{opacity:0; transform:scale(1.06); pointer-events:none}
  .stile{width:150px; height:150px; padding:10px; border-radius:34px; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,.45), 0 0 80px color-mix(in srgb,var(--accent) 35%,transparent); animation:stilein .8s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes stilein{from{transform:scale(.6) rotate(-12deg); opacity:0}}
  .stile svg{width:100%; height:100%}
  .se{stroke-dasharray:1; stroke-dashoffset:1; animation:draw2 1.1s .35s ease-out forwards}
  @keyframes draw2{to{stroke-dashoffset:0}}
  .st{opacity:0; animation:fadeIn .5s .75s forwards}
  .sname{margin-top:14px; font-family:var(--font-d); font-weight:700; font-size:32px; letter-spacing:.02em; opacity:0; animation:fadeUp .6s .9s forwards}
  .ssub{color:var(--mute); font-size:14px; letter-spacing:.2em; text-transform:uppercase; opacity:0; animation:fadeUp .6s 1.05s forwards}
  @keyframes fadeUp{from{transform:translateY(10px)} to{opacity:1; transform:none}}
  .sbar{margin-top:18px; width:180px; height:3px; border-radius:3px; background:var(--line); overflow:hidden}
  .sbar b{display:block; height:100%; width:100%; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg,var(--accent),var(--accent2)); animation:fill 1.7s .1s ease-in-out forwards}
  @keyframes fill{to{transform:scaleX(1)}}

  /* ============ Polish pass ============ */
  /* entrance animations wait until the intro has finished */
  body:not(.ready) .card, body:not(.ready) .ln, body:not(.ready) .rv, body:not(.ready) .spark path{animation-play-state:paused}
  .ln{display:inline-block; animation:lnIn 1s cubic-bezier(.2,.8,.2,1) backwards}
  .ln.d2{animation-delay:.16s}
  @keyframes lnIn{from{opacity:0; transform:translateY(30px)}}
  .rv{animation:rvIn .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:calc(var(--i,0) * 70ms + .25s)}
  @keyframes rvIn{from{opacity:0; transform:translateY(16px)}}
  @keyframes bob{50%{transform:translateZ(30px) translateY(-4px)}}

  /* header: slow light sweep along its bottom edge */
  .head::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--accent),transparent); background-size:30% 100%; background-repeat:no-repeat; animation:sweep 7s linear infinite}
  @keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
  .tab svg.ic{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
  .tab:hover svg.ic{transform:translateY(-2px) scale(1.12)}

  /* card: rotating light along the border on hover */
  @property --ang{syntax:"<angle>"; inherits:false; initial-value:0deg}
  .card .ring{position:absolute; inset:0; border-radius:inherit; padding:1.5px; pointer-events:none; opacity:0; transition:opacity .35s;
    background:conic-gradient(from var(--ang), transparent 0 55%, var(--c) 78%, #fff 90%, transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
    animation:spinang 3.2s linear infinite}
  .card:hover .ring{opacity:1}
  @keyframes spinang{to{--ang:360deg}}

  /* top loading bar */
  .topbar{position:fixed; left:0; top:var(--head-h); height:3px; width:0; z-index:19; pointer-events:none; opacity:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 12px var(--accent); border-radius:0 3px 3px 0}
  body.kiosk .topbar{top:0}

  /* dashboard-shaped skeleton behind the loader */
  .loader > *:not(.sk){position:relative; z-index:1}
  .sk{position:absolute; inset:0; padding:26px; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:92px; gap:16px; align-content:start; opacity:.7; pointer-events:none}
  .sk i,.sk b{display:block; border-radius:16px; border:1px solid var(--line);
    background:linear-gradient(100deg,var(--surface) 30%,rgba(255,255,255,.10) 50%,var(--surface) 70%); background-size:220% 100%; animation:shim 1.6s linear infinite}
  .sk b{grid-column:span 2; grid-row:span 3}
  @keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}

  ::view-transition-old(root),::view-transition-new(root){animation:none; mix-blend-mode:normal}

  /* ============ Time-of-day colours ============ */
  @property --accent{syntax:"<color>"; inherits:true; initial-value:#4da3ff}
  @property --accent2{syntax:"<color>"; inherits:true; initial-value:#2563eb}
  @property --b1{syntax:"<color>"; inherits:true; initial-value:#2563eb}
  @property --b2{syntax:"<color>"; inherits:true; initial-value:#4da3ff}
  @property --b3{syntax:"<color>"; inherits:true; initial-value:#0ea5e9}
  @property --bg2{syntax:"<color>"; inherits:true; initial-value:#0b1426}
  :root{transition:--accent 2.5s linear,--accent2 2.5s linear,--b1 2.5s linear,--b2 2.5s linear,--b3 2.5s linear,--bg2 2.5s linear}

  /* ============ Responsive ============ */
  @media (max-width:1100px){ .head{gap:14px; padding:0 14px} .tab{padding:0 11px; font-size:14.5px; gap:7px} .brand p{display:none} .search span,.search kbd{display:none} .search{padding:0 11px} }
  @media (max-width:900px){ .brand > div:last-child{display:none} .btn.opt{display:none} .stats{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){
    :root{--head-h:58px}
    .head{justify-content:space-between; padding:0 12px; gap:10px}
    .brand > div:last-child{display:block}
    .mark{width:38px; height:38px; font-size:12.5px}
    .mark.logo{width:42px; height:42px}
    .brand h1{font-size:18px}
    .tabs{
      position:fixed; left:0; right:0; bottom:0; z-index:25; gap:0; overflow:visible;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
      background:var(--head); border-top:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    }
    .tab{flex:1 1 0; min-width:0; flex-direction:column; justify-content:center; gap:3px; padding:0 1px; font-size:11px}
    .tab svg.ic{width:22px; height:22px}
    .ink{top:0; bottom:auto; border-radius:0 0 3px 3px}
    .lamp{position:absolute; top:10px; right:calc(50% - 20px); width:6px; height:6px}
    .stage{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
    .wrap{padding:22px 16px 34px}
    .hero{margin-top:16px} .clock{text-align:left}
    .grid{grid-template-columns:1fr; gap:16px; margin-top:20px}
    .card{padding:20px 18px 18px; transform:none!important}
    .card h3{font-size:23px}
    .toast{bottom:calc(var(--nav-h) + 20px)}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; animation-iteration-count:1!important; transition:none!important} .spark path.l{stroke-dashoffset:0} .card{opacity:1} }

  /* ============ Performance ============ */
  html{-webkit-tap-highlight-color:transparent}
  /* While a dashboard is open it covers the backdrop completely, so stop painting it */
  body.in-dash .backdrop, body.in-dash .gears{visibility:hidden}
  body.in-dash .blob{animation-play-state:paused}
  body.in-dash .head{backdrop-filter:none; -webkit-backdrop-filter:none}
  body.in-dash .head::after, body.in-dash .mark::after{animation:none}
  /* remote / keyboard focus looks like hover (Android TV D-pad) */
  .card:focus-visible{border-color:color-mix(in srgb,var(--c) 70%,transparent); outline:3px solid var(--accent); outline-offset:3px}
  .card:focus-visible::before{opacity:1}
  .tab:focus-visible{background:var(--hover); outline-offset:-3px}

  /* ---- LITE mode: TVs, low-RAM and slow devices. Same layout, far fewer effects ---- */
  html.lite, html.lite body{transition:none}
  html.lite .blob, html.lite #fx, html.lite .cglow, html.lite .gears, html.lite .backdrop::after, html.lite .iris{display:none!important}
  html.lite *, html.lite *::before, html.lite *::after{backdrop-filter:none!important; -webkit-backdrop-filter:none!important}
  html.lite .head{background:var(--surface-solid)}
  html.lite .tabs{background:var(--surface-solid)}
  html.lite .pal{background:rgba(3,7,15,.7)}
  html.lite .mark::after, html.lite .head::after, html.lite .ring, html.lite .sk i, html.lite .sk b,
  html.lite .tile, html.lite .grad, html.lite .sep i, html.lite .dot::after, html.lite .secbar b, html.lite .mq .track,
  html.lite .ln, html.lite .rv, html.lite .card, html.lite .pane.active, html.lite .caret{animation:none!important}
  html.lite .secbar{display:none}
  html.lite .spark path.l{stroke-dashoffset:0; animation:none}
  html.lite .spark path.a{opacity:1; animation:none}
  html.lite .grid{perspective:none}
  html.lite .card{transform:none!important; transform-style:flat; box-shadow:none; transition:border-color .15s}
  html.lite .card:hover{box-shadow:none}
  html.lite .card::before, html.lite .tab svg.ic, html.lite .brand .mark.logo, html.lite .open, html.lite .open svg, html.lite .stat, html.lite .btn, html.lite .chip{transition:none}
  html.lite .ink{transition:transform .2s ease-out}
  html.lite .splash{display:none}
  html.lite .toast{transition:opacity .2s}
</style>
</head>

/* deterministic sparkline per dashboard */
function seeded(seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296 } }
function spark(id){
  const r = seeded(id), n = 14, W = 300, H = 46; let y = .5, pts = [];
  for(let i=0;i<n;i++){ y = Math.min(.92, Math.max(.08, y + (r()-.42)*.34)); pts.push([i*W/(n-1), H - y*H]); }
  const d = pts.map((p,i)=> i ? `L${p[0].toFixed(1)},${p[1].toFixed(1)}` : `M${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="g-${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c)" stop-opacity=".35"/><stop offset="1" stop-color="var(--c)" stop-opacity="0"/></linearGradient></defs>
    <path class="a" style="fill:url(#g-${id})" d="${d} L${W},${H} L0,${H} Z"/><path class="l" d="${d}"/></svg>`;
}

/* ---------- full screen + TV (auto-cycle) mode ---------- */
let cycTimer = null, cycIdx = 0, cycPaused = false, cycStart = 0, cycLeft = CYCLE_SECONDS*1000;
const kiosk = on => { document.body.classList.toggle("kiosk", on); if(!on) stopCycle(); setTimeout(moveInk, 50); };
function runProgress(ms){
  const p = $("#cprog"); p.style.transition = "none"; p.style.width = "0";
  void p.offsetWidth; p.style.transition = `width ${ms}ms linear`; p.style.width = "100%";
}
function cycleShow(){
  const d = DASHBOARDS[cycIdx]; select(d.id); $("#klabel").textContent = d.label;
  cycLeft = CYCLE_SECONDS*1000; cycStart = Date.now(); runProgress(cycLeft);
  clearTimeout(cycTimer); cycTimer = setTimeout(() => cycleStep(1), cycLeft);
}
function cycleStep(dir){ cycIdx = (cycIdx + dir + DASHBOARDS.length) % DASHBOARDS.length; cycPaused = false; setPauseIcon(); cycleShow(); }
function setPauseIcon(){ $("#kPauseIc").innerHTML = cycPaused ? '<path d="m7 4 13 8-13 8z"/>' : '<path d="M8 5v14M16 5v14"/>'; }
function startCycle(){

  toast("TV mode: switching every " + CYCLE_SECONDS + "s. Esc to exit");
}
function stopCycle(){
  if(!document.body.classList.contains("cycling")) return;
  document.body.classList.remove("cycling"); clearTimeout(cycTimer); cycTimer = null; $("#cprog").style.width = "0";
}

    p.style.width = p.getBoundingClientRect().width + "px"; p.style.transition = "none";

    cycPaused = false; cycStart = Date.now(); runProgress(cycLeft); cycTimer = setTimeout(() => cycleStep(1), cycLeft);

}

/* ---------- keyboard ---------- */

  if(pal.classList.contains("open") || e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  if(k === "f"){ kiosk(!document.body.classList.contains("kiosk")); return; }

    if(e.key === " "){ e.preventDefault(); togglePause(); return; }

/* ---------- particle network backdrop ----------
   Only runs on Home, on capable devices, at ~30fps, and stops by itself otherwise. */
(function(){
  if(reduce) return;
  const cv = $("#fx"), cx = cv.getContext("2d"); let P = [], mouse = {x:-999, y:-999}, running = false, last = 0;
  const ok = () => !PERF.lite && !document.hidden && current === "home";
  function size(){
    const r = Math.min(devicePixelRatio || 1, 1.5); cv.width = innerWidth*r; cv.height = innerHeight*r; cx.setTransform(r,0,0,r,0,0);
    const n = Math.min(55, Math.floor(innerWidth*innerHeight/26000));
    P = Array.from({length:n}, () => ({x:Math.random()*innerWidth, y:Math.random()*innerHeight, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25}));
  }
  size(); let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(size, 200); });
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; }, {passive:true});
  function loop(t){
    if(!ok()){ running = false; return; }
    requestAnimationFrame(loop);
    const dt = Math.min(3, (t - last) / 16.7 || 1); if(t - last < 30) return; last = t;
    cx.clearRect(0,0,innerWidth,innerHeight);
    const light = document.documentElement.dataset.theme === "light", rgb = light ? "18,40,74" : "170,195,255";
    cx.fillStyle = `rgba(${rgb},.5)`; cx.beginPath();
    for(const p of P){
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(p.x<0||p.x>innerWidth) p.vx*=-1; if(p.y<0||p.y>innerHeight) p.vy*=-1;
      cx.moveTo(p.x+1.5,p.y); cx.arc(p.x,p.y,1.5,0,6.283);
    }
    cx.fill(); cx.lineWidth = 1;
    for(let i=0;i<P.length;i++){
      for(let j=i+1;j<P.length;j++){
        const dx = P[i].x-P[j].x, dy = P[i].y-P[j].y, d = dx*dx+dy*dy;
        if(d < 14000){ cx.strokeStyle = `rgba(${rgb},${(1-d/14000)*.16})`; cx.beginPath(); cx.moveTo(P[i].x,P[i].y); cx.lineTo(P[j].x,P[j].y); cx.stroke(); }
      }
      const mx = P[i].x-mouse.x, my = P[i].y-mouse.y, md = mx*mx+my*my;
      if(md < 22000){ cx.strokeStyle = `rgba(${window.ACC_RGB||"77,163,255"},${(1-md/22000)*.45})`; cx.beginPath(); cx.moveTo(P[i].x,P[i].y); cx.lineTo(mouse.x,mouse.y); cx.stroke(); }
    }
  }
  const kick = () => { if(!running && ok()){ running = true; last = 0; requestAnimationFrame(loop); } };
  kicks.push(kick); document.addEventListener("visibilitychange", kick);
})();

/* ---------- colour-wipe transition between dashboards ---------- */
let lastPt = { x: innerWidth/2, y: innerHeight/2 };
addEventListener("pointerdown", e => { lastPt = { x:e.clientX, y:e.clientY }; }, true);
function irisFx(id){
  if(reduce || PERF.lite || document.body.classList.contains("cycling")) return;
  const el = $("#iris"), d = panes[id].d;
  el.style.setProperty("--ic", d ? d.color : "var(--accent)");
  el.style.setProperty("--ix", lastPt.x + "px"); el.style.setProperty("--iy", lastPt.y + "px");
  el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
}

/* ---------- typewriter tagline ---------- */
(function(){
  const el = $("#tw"), W = ["Safety first.", "Quality always.", "Delivery on time.", "Cost under control.", "Every shift. Every line."];
  if(reduce){ el.textContent = W[0]; return; }
  let wi = 0, ci = 0, del = false;
  (function step(){
    if(current !== "home" || document.hidden){ setTimeout(step, 600); return; }
    const w = W[wi]; ci += del ? -1 : 1; el.textContent = w.slice(0, ci);
    let t = del ? 35 : 70;
    if(!del && ci === w.length){ del = true; t = 1700; }
    else if(del && ci === 0){ del = false; wi = (wi + 1) % W.length; t = 350; }
    setTimeout(step, t);
  })();
})();


/* ---------- slowly turning gears behind the home page ---------- */
(function(){
  function gear(r, n, tooth){
    const ri = r - tooth, w = Math.PI*2/n; let d = "";
    for(let i=0;i<n;i++){ [[ri,0],[r,.2],[r,.45],[ri,.65]].forEach(([rad,k],j) => {
      const t = i*w + k*w; d += (i+j ? "L" : "M") + (rad*Math.cos(t)).toFixed(1) + "," + (rad*Math.sin(t)).toFixed(1); }); }
    const h = r*.35; return d + `ZM${h},0A${h},${h} 0 1 0 ${-h},0A${h},${h} 0 1 0 ${h},0Z`;
  }
  const g = document.createElement("div"); g.className = "gears"; g.setAttribute("aria-hidden","true");
  g.innerHTML = `<svg viewBox="0 0 620 620" fill="currentColor">
    <g transform="translate(400,400)"><g class="spin"><path fill-rule="evenodd" d="${gear(210,16,34)}"/></g></g>
    <g transform="translate(150,170)"><g class="spin rev"><path fill-rule="evenodd" d="${gear(120,10,26)}"/></g></g></svg>`;
  home.appendChild(g);
})();

/* ---------- safe-days counter ---------- */
(function(){
  if(!SAFE_SINCE) return; const t = new Date(SAFE_SINCE); if(isNaN(t)) return;
  $("#safeN").textContent = Math.max(0, Math.floor((Date.now() - t) / 864e5));
  $("#safeL").textContent = "Days without a lost-time incident"; $("#safeStat").classList.add("safe");
})();

/* ---------- cursor glow that trails the mouse (stops when it has caught up) ---------- */
(function(){
  if(reduce || coarse) return;
  const g = $("#cglow"); let x = innerWidth/2, y = innerHeight/2, tx = x, ty = y, run = false;
  const ok = () => !PERF.lite && !document.hidden && current === "home";
  function f(){
    if(!ok()){ run = false; return; }
    x += (tx-x)*.12; y += (ty-y)*.12; g.style.transform = `translate3d(${x-250}px,${y-250}px,0)`;
    if(Math.abs(tx-x) < .5 && Math.abs(ty-y) < .5){ run = false; return; }
    requestAnimationFrame(f);
  }
  const kick = () => { if(!run && ok()){ run = true; requestAnimationFrame(f); } };
  addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; kick(); }, {passive:true});
  kicks.push(kick);
})();

/* ---------- intro splash (once per visit) ---------- */
(function(){
  const s = $("#splash"); let seen = false;
  const ready = () => { document.body.classList.add("ready"); document.dispatchEvent(new Event("picl-ready")); };
  try{ seen = sessionStorage.getItem("picl_splash"); }catch(e){}
  if(reduce || PERF.lite || seen || (location.hash && location.hash !== "#home")){ s.remove(); ready(); return; }
  try{ sessionStorage.setItem("picl_splash","1"); }catch(e){}
  const out = () => { s.classList.add("out"); ready(); setTimeout(() => s.remove(), 700); };
  s.addEventListener("click", out); setTimeout(out, 2100);
})();

/* ---------- top loading bar ---------- */
const tbar = $("#topbar"); let tbT;
function tbStart(){
  clearTimeout(tbT); tbar.style.transition = "none"; tbar.style.opacity = "1"; tbar.style.width = "0"; void tbar.offsetWidth;
  tbar.style.transition = "width 7s cubic-bezier(.1,.6,.2,1)"; tbar.style.width = "85%";
}
function tbDone(){
  tbar.style.transition = "width .3s ease-out"; tbar.style.width = "100%";
  tbT = setTimeout(() => { tbar.style.transition = "opacity .4s"; tbar.style.opacity = "0"; }, 350);
}

/* ---------- staggered reveal of home elements ---------- */
(function(){
  let i = 0;
  document.querySelectorAll(".eyebrow .pill,.type,.lead,.clock,.stat,.mq,.foot").forEach(el => { el.classList.add("rv"); el.style.setProperty("--i", i++); });
})();

/* ---------- magnetic header buttons ---------- */
document.querySelectorAll(".btn,.search").forEach(el => {
  el.addEventListener("pointermove", e => {
    if(e.pointerType !== "mouse" || reduce || PERF.lite) return;
    const b = el.getBoundingClientRect();
    el.style.transform = `translate(${((e.clientX - b.left)/b.width - .5) * 7}px,${((e.clientY - b.top)/b.height - .5) * 7}px)`;
  });
  el.addEventListener("pointerleave", () => { el.style.transform = ""; });
});

/* ---------- grid parallax (one write per frame, only on the backdrop) ---------- */
(function(){
  if(reduce || coarse) return;
  const bd = $(".backdrop"); let px = 0, py = 0, q = false;
  addEventListener("pointermove", e => {
    if(PERF.lite || current !== "home") return;
    px = (e.clientX/innerWidth - .5) * -22; py = (e.clientY/innerHeight - .5) * -22;
    if(q) return; q = true;
    requestAnimationFrame(() => { q = false; bd.style.setProperty("--gx", px.toFixed(1) + "px"); bd.style.setProperty("--gy", py.toFixed(1) + "px"); });
  }, {passive:true});
})();

/* ---------- colours that follow the time of day (all blue family) ---------- */
const SKY = [
  { h:0,   n:"Night",     a:"#5b8cff", b:"#2f4fd8", k:["#1e3a8a","#4f46e5","#0b3b8f"] },
  { h:5.5, n:"Dawn",      a:"#8ab4ff", b:"#6366f1", k:["#6d7cff","#a5b4fc","#38bdf8"] },
  { h:9,   n:"Morning",   a:"#38bdf8", b:"#2563eb", k:["#0ea5e9","#38bdf8","#2563eb"] },
  { h:13,  n:"Midday",    a:"#4da3ff", b:"#2563eb", k:["#2563eb","#0ea5e9","#1d4ed8"] },
  { h:17,  n:"Afternoon", a:"#4f8bff", b:"#4338ca", k:["#3b82f6","#6366f1","#0ea5e9"] },
  { h:19.5,n:"Evening",   a:"#818cf8", b:"#7c3aed", k:["#4f46e5","#7c3aed","#2563eb"] },
  { h:22,  n:"Night",     a:"#5b8cff", b:"#2f4fd8", k:["#1e3a8a","#4f46e5","#0b3b8f"] },
  { h:24,  n:"Night",     a:"#5b8cff", b:"#2f4fd8", k:["#1e3a8a","#4f46e5","#0b3b8f"] }
];
const hx = c => [1,3,5].map(i => parseInt(c.slice(i, i+2), 16));
const mixc = (c1, c2, t) => { const A = hx(c1), B = hx(c2); return "#" + A.map((v,i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2,"0")).join(""); };
function applyTime(){
  const n = new Date(), h = n.getHours() + n.getMinutes()/60;
  let i = 0; while(i < SKY.length - 2 && h >= SKY[i+1].h) i++;
  const A = SKY[i], B = SKY[i+1], t = (h - A.h) / (B.h - A.h);
  const a = mixc(A.a, B.a, t), b = mixc(A.b, B.b, t), k = A.k.map((c,j) => mixc(c, B.k[j], t));
  const light = document.documentElement.dataset.theme === "light", s = document.documentElement.style;
  s.setProperty("--accent",  light ? mixc(a, "#0a2a6e", .4)  : a);
  s.setProperty("--accent2", light ? mixc(b, "#0a2a6e", .35) : b);
  s.setProperty("--b1", k[0]); s.setProperty("--b2", k[1]); s.setProperty("--b3", k[2]);
  if(light) s.removeProperty("--bg2"); else s.setProperty("--bg2", mixc("#0b1426", a, .09));
  window.ACC_RGB = hx(a).join(",");
  const el = $("#skyTxt"); if(el) el.textContent = (t < .5 ? A.n : B.n) + " tones";
}
setInterval(applyTime, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) applyTime(); });

/* ---------- auto "smooth mode": if Home runs below ~25fps, drop to lite and remember it ---------- */
(function(){
  if(PERF.lite || PERF.forced || reduce) return;
  let n = 0, slow = 0, prev = 0;
  function f(t){
    if(PERF.lite) return;
    if(document.hidden || current !== "home"){ n = slow = prev = 0; setTimeout(() => requestAnimationFrame(f), 600); return; }
    if(prev){ n++; if(t - prev > 40) slow++; }
    prev = t;
    if(n < 150) requestAnimationFrame(f);
    else if(slow / n > .3){ setLite(true, true); toast("Smooth mode turned on for this device"); }
  }
  setTimeout(() => requestAnimationFrame(f), 3200);   /* after the intro has finished */
})();

/* ---------- start ---------- */
setTheme(store.get("picl_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
select(location.hash.slice(1) || "home");
</script>
